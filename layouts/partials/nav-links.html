{{/* Expects (dict "page" <page> "current" <path of the nav item to mark>) */}}
{{ $current := .current }}
{{ if .page.Site.Menus.main }}
  {{ range .page.Site.Menus.main }}<a href="{{ .URL }}"{{ if eq (relURL .URL) $current }} aria-current="page"{{ end }}>{{ .Name }}</a>{{ end }}
{{ else }}
  <a href="{{ "/" | relURL }}"{{ if eq $current ("/" | relURL) }} aria-current="page"{{ end }}>Home</a>
  <a href="{{ "/archive/" | relURL }}"{{ if eq $current ("/archive/" | relURL) }} aria-current="page"{{ end }}>Archive</a>
{{ end }}
