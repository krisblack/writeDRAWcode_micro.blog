<a class="skip-link" href="#content">Skip to content</a>
<header class="site-header">
  <nav class="social-icons social-icons--small" aria-label="Follow">
    {{ partial "social-icons.html" . }}
  </nav>
  <div class="site-header-row">
    <a class="site-title" href="{{ "/" | relURL }}">{{ partial "wordmark.html" . }}</a>
    <nav class="site-nav" aria-label="Main">
      {{ $current := .RelPermalink }}
      {{ if .Site.Menus.main }}
        {{ range .Site.Menus.main }}<a href="{{ .URL }}"{{ if eq (relURL .URL) $current }} aria-current="page"{{ end }}>{{ .Name }}</a>{{ end }}
      {{ else }}
        <a href="{{ "/" | relURL }}"{{ if $.IsHome }} aria-current="page"{{ end }}>Home</a>
        <a href="{{ "/archive/" | relURL }}"{{ if eq $current ("/archive/" | relURL) }} aria-current="page"{{ end }}>Archive</a>
      {{ end }}
    </nav>
  </div>
</header>
