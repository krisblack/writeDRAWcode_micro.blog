<!DOCTYPE html>
<html lang="en">
<head>
{{ partial "head.html" . }}
</head>
<body>
{{ partial "header.html" . }}
<main id="content" class="site-main">
  <section class="post-list">
    {{ with .Title }}<h1 class="page-title">{{ . }}</h1>{{ end }}
    {{ range .Paginator.Pages }}
      {{ partial "post-item.html" . }}
    {{ end }}
    {{ partial "pagination.html" . }}
  </section>
</main>
{{ partial "footer.html" . }}
</body>
</html>
